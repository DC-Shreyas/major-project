[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blr-micro-market-valuation"
version = "0.1.0"
description = "Research pipeline for Bengaluru residential property valuation"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "torch>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
